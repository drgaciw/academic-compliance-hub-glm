name: Production Deployment

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment environment"
        required: true
        default: "production"
        type: choice
        options:
          - production
          - staging
      skip_tests:
        description: "Skip tests (emergency only)"
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  deployments: write
  pull-requests: write
  id-token: write

jobs:
  approval:
    name: Approval Gate
    runs-on: ubuntu-latest
    environment: production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Wait for approval
        run: |
          echo "⏳ Waiting for deployment approval"
          echo "Please review the changes in the PR before approving"

  quality-checks:
    name: Quality Checks
    runs-on: ubuntu-latest
    needs: approval
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.skip_tests)

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Cache node_modules
        uses: actions/cache@v3
        with:
          path: |
            ~/.pnpm-store
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Cache Turbo with remote cache
        uses: actions/cache@v3
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate environment variables
        run: node scripts/validate-env.js ${{ github.event.inputs.environment || 'production' }}

      - name: Run lint
        run: pnpm run lint

      - name: Run type check
        run: pnpm run type-check

      - name: Run tests
        run: pnpm run test:unit

      - name: Build application
        run: pnpm run build
        env:
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: approval

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run npm audit
        run: pnpm audit --audit-level moderate
        continue-on-error: true

      - name: Check for secrets
        run: |
          if git grep -iE "password|secret|key|token" -- "*.ts" "*.tsx" "*.js" "*.jsx" | grep -vE "//.*password|//.*secret|//.*key|//.*token" | head; then
            echo "::error::Potential secrets found in code"
            exit 1
          fi
        continue-on-error: true

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [quality-checks, security-scan]
    environment: production
    if: always() && (needs.quality-checks.result == 'success' || needs.quality-checks.result == 'skipped') && needs.security-scan.result == 'success'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Deploy to Vercel Production
        id: vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: "--prod"
          working-directory: ./

      - name: Create deployment status
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: context.repo.id,
              state: 'success',
              environment_url: '${{ steps.vercel.outputs.preview-url }}',
              log_url: 'https://vercel.com'
            })

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [quality-checks, security-scan]
    environment: staging
    if: always() && (needs.quality-checks.result == 'success' || needs.quality-checks.result == 'skipped') && github.event.inputs.environment == 'staging'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Deploy to Vercel Staging
        id: vercel-staging
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          alias-domains: '["staging.aah.vercel.app"]'
          working-directory: ./

      - name: Create deployment status
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: context.repo.id,
              state: 'success',
              environment_url: '${{ steps.vercel-staging.outputs.preview-url }}',
              log_url: 'https://vercel.com'
            })

  notify:
    name: Notify Deployment
    runs-on: ubuntu-latest
    needs: [deploy-production, deploy-staging]
    if: always()

    steps:
      - name: Create deployment comment
        uses: actions/github-script@v7
        with:
          script: |
            const environment = '${{ github.event.inputs.environment || 'production' }}';
            const status = needs.deploy-production.result === 'success' ? '✅ Success' : '❌ Failed';
            const emoji = needs.deploy-production.result === 'success' ? '🚀' : '⚠️';

            const comment = `
            ### ${emoji} Deployment ${status}

            **Environment:** ${environment}
            **Commit:** \`${{ github.sha }}\`
            **Branch:** \`${{ github.ref_name }}\`
            **Triggered by:** @${{ github.actor }}

            **Status:** ${status}

            ---

            *Deployment completed at: ${new Date().toISOString()}*`;

            if (context.eventName === 'push') {
              console.log('Deployment completed successfully');
            } else {
              console.log(comment);
            }
