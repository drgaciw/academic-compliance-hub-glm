name: Preview Comment

on:
  pull_request:
    types: [opened, synchronize, reopened]
  deployment_status:
    types: [success]

permissions:
  pull-requests: write
  deployments: read

jobs:
  preview-comment:
    name: Add Preview URL Comment
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event.deployment_status.state == 'success'

    steps:
      - name: Extract preview URL
        id: extract-url
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            echo "For PR previews, the URL will be commented by Vercel"
            echo "status=pending" >> $GITHUB_OUTPUT
          else
            PREVIEW_URL="${{ github.event.deployment_status.target_url }}"
            echo "preview_url=$PREVIEW_URL" >> $GITHUB_OUTPUT
            echo "status=success" >> $GITHUB_OUTPUT
          fi

      - name: Comment preview URL on PR
        if: steps.extract-url.outputs.status == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const previewUrl = '${{ steps.extract-url.outputs.preview_url }}';
            const prNumber = context.payload.pull_request?.number || context.issue.number;

            const commentBody = `### 🚀 Preview Deployment Ready!

            Your changes have been deployed to a preview environment.

            **Preview URL:** ${previewUrl}

            ---

            *This comment will be updated if you push new commits to this PR.*`;

            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });

            const botComment = comments.data.find(comment =>
              comment.user.type === 'Bot' &&
              comment.body.includes('🚀 Preview Deployment Ready!')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: commentBody,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: commentBody,
              });
            }

      - name: Comment deployment pending on PR
        if: steps.extract-url.outputs.status == 'pending'
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.issue.number;

            const commentBody = `### 🏗️ Deployment in Progress...

            Your changes are being deployed to a preview environment.

            The preview URL will be posted here once deployment is complete.

            ---

            *Check the Actions tab for deployment status.*`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: commentBody,
            });
