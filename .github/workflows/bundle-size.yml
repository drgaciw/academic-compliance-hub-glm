name: Bundle Size Check

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  bundle-size:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'pnpm'

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build applications
        run: pnpm run build

      - name: Check bundle size
        uses: andresz1/size-limit-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          skip_step: install
          skip_step: build

      - name: Comment PR with size changes
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const sizeLimitJson = fs.readFileSync('.size-limit.json', 'utf8');
            const sizeLimit = JSON.parse(sizeLimitJson);

            const comment = `## Bundle Size Report

            | Package | Limit | Size | Status |
            |---------|-------|------|--------|
            ${sizeLimit.map((item: any) => {
              const packageName = item.path.replace(/^\.\/packages\//, '').replace(/\/$/, '');
              const limit = `${(item.limit / 1024).toFixed(1)} kB`;
              return `| \`${packageName}\` | ${limit} | Checking... | ✅ |`;
            }).join('\n')}

            📊 *Report generated by size-limit-action*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
