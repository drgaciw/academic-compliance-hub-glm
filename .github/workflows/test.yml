name: Test Suite

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # Unit and Integration Tests
  unit-tests:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest

    strategy:
      matrix:
        app: [admin, main, student]
        package: [ui]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        if: matrix.app != 'ui'
        working-directory: ./apps/${{ matrix.app }}
        run: pnpm test:unit

      - name: Run UI package tests
        if: matrix.package == 'ui'
        working-directory: ./packages/${{ matrix.package }}
        run: pnpm test:unit

      - name: Run integration tests
        if: matrix.app != 'ui'
        working-directory: ./apps/${{ matrix.app }}
        run: pnpm test:integration

      - name: Generate coverage report
        if: matrix.app != 'ui'
        working-directory: ./apps/${{ matrix.app }}
        run: pnpm test:coverage

      - name: Generate UI coverage report
        if: matrix.package == 'ui'
        working-directory: ./packages/${{ matrix.package }}
        run: pnpm test:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: |
            ./apps/admin/coverage/lcov.info
            ./apps/main/coverage/lcov.info
            ./apps/student/coverage/lcov.info
            ./packages/ui/coverage/lcov.info
          flags: ${{ matrix.app || matrix.package }}
          name: codecov-${{ matrix.app || matrix.package }}
          fail_ci_if_error: false

      - name: Check coverage thresholds
        if: matrix.app != 'ui'
        working-directory: ./apps/${{ matrix.app }}
        run: |
          COVERAGE=$(cat coverage/coverage-summary.json | jq '.total.lines.pct')
          if (( $(echo "$COVERAGE < 80" | bc -l) )); then
            echo "Coverage $COVERAGE% is below 80% threshold"
            exit 1
          fi
          echo "Coverage $COVERAGE% meets 80% threshold"

      - name: Check UI coverage thresholds
        if: matrix.package == 'ui'
        working-directory: ./packages/${{ matrix.package }}
        run: |
          COVERAGE=$(cat coverage/coverage-summary.json | jq '.total.lines.pct')
          if (( $(echo "$COVERAGE < 80" | bc -l) )); then
            echo "Coverage $COVERAGE% is below 80% threshold"
            exit 1
          fi
          echo "Coverage $COVERAGE% meets 80% threshold"

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: coverage-${{ matrix.app || matrix.package }}
          path: |
            ./apps/${{ matrix.app }}/coverage/
            ./packages/${{ matrix.package }}/coverage/
          retention-days: 7

  # E2E Tests
  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest

    strategy:
      matrix:
        browser: [chromium, firefox, webkit]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps ${{ matrix.browser }}

      - name: Build application
        run: pnpm build

      - name: Run E2E tests
        working-directory: ./apps/admin
        run: pnpm test:e2e --project=${{ matrix.browser }}
        env:
          CI: true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: playwright-report-${{ matrix.browser }}
          path: apps/admin/playwright-report/
          retention-days: 7

      - name: Upload screenshots
        if: failure()
        uses: actions/upload-artifact@v3
        with:
          name: screenshots-${{ matrix.browser }}
          path: apps/admin/test-results/
          retention-days: 7

  # Accessibility Tests
  accessibility-tests:
    name: Accessibility Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright
        run: pnpm exec playwright install --with-deps chromium

      - name: Build application
        run: pnpm build

      - name: Run accessibility tests
        working-directory: ./apps/admin
        run: pnpm test:e2e --project=chromium tests/e2e/accessibility/
        env:
          CI: true

      - name: Upload accessibility report
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: accessibility-report
          path: apps/admin/accessibility-report/
          retention-days: 30

  # Performance Tests
  performance-tests:
    name: Performance Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build application
        run: pnpm build

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v10
        with:
          uploadArtifacts: true
          temporaryPublicStorage: true
          urls: |
            http://localhost:3000/compliance/dashboard
            http://localhost:3000/transcripts/upload
            http://localhost:3000/eligibility/review
          budgetPath: ./.github/lighthouse-budget.json

  # TestSprite Integration
  testsprite-tests:
    name: TestSprite Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build application
        run: pnpm build

      - name: Start application
        run: pnpm start &
        env:
          PORT: 3000

      - name: Wait for application
        run: sleep 10

      - name: Bootstrap TestSprite
        run: npx @testsprite/testsprite-mcp@latest bootstrap
        env:
          PROJECT_PATH: ${{ github.workspace }}
          LOCAL_PORT: 3000
          TYPE: frontend
          TEST_SCOPE: codebase

      - name: Generate and run tests
        run: npx @testsprite/testsprite-mcp@latest generate-and-execute
        env:
          PROJECT_NAME: academic-compliance-hub-glm
          PROJECT_PATH: ${{ github.workspace }}
          TEST_IDS: "[]"
          ADDITIONAL_INSTRUCTION: |
            Focus on FERPA compliance, accessibility, and performance testing

      - name: Upload TestSprite results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: testsprite-results
          path: testsprite_tests/
          retention-days: 30

  # Coverage Summary
  coverage-summary:
    name: Coverage Summary
    runs-on: ubuntu-latest
    needs: [unit-tests]
    if: always()

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download coverage artifacts
        uses: actions/download-artifact@v3
        with:
          path: coverage-artifacts/

      - name: Generate coverage summary
        run: |
          echo "# Coverage Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Package | Lines | Functions | Branches | Statements |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|--------|-----------|-----------|------------|" >> $GITHUB_STEP_SUMMARY

          for dir in coverage-artifacts/coverage-*/; do
            if [ -f "$dir/coverage-summary.json" ]; then
              package=$(basename "$dir" | sed 's/coverage-//')
              lines=$(cat "$dir/coverage-summary.json" | jq -r '.total.lines.pct // "N/A"')
              functions=$(cat "$dir/coverage-summary.json" | jq -r '.total.functions.pct // "N/A"')
              branches=$(cat "$dir/coverage-summary.json" | jq -r '.total.branches.pct // "N/A"')
              statements=$(cat "$dir/coverage-summary.json" | jq -r '.total.statements.pct // "N/A"')
              echo "| $package | $lines% | $functions% | $branches% | $statements% |" >> $GITHUB_STEP_SUMMARY
            fi
          done
